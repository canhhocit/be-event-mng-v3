name: CI-CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build image
        run: docker build -t canhhocit/event-mng:latest .

      - name: Push image
        run: docker push canhhocit/event-mng:latest

      - name: Deploy Ubuntu
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull canhhocit/event-mng:latest

            docker stop event-mng || true
            docker rm event-mng || true

            docker run -d \
              --name event-mng \
              -p 8080:8080 \
              --add-host=host.docker.internal:host-gateway \
              --env-file ~/be-event-mng-v3/.env \
              canhhocit/event-mng:latest