spring.application.name=event-mng

server.port=${PORT:8080}

# Database Configuration (Neon / PostgreSQL)
spring.datasource.url=${DATABASE_URL:${POSTGRES_URL:${MYSQL_URL:jdbc:postgresql://localhost:5432/event_mng}}}
spring.datasource.username=${POSTGRES_USER:${POSTGRESUSER:${MYSQLUSER:postgres}}}
spring.datasource.password=${POSTGRES_PASSWORD:${POSTGRESPASSWORD:${MYSQLPASSWORD:postgres}}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Pool Optimization for Cloud/Neon DB
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=3000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Flyway Database Migration
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Spring Boot Actuator Probe Configuration
management.endpoints.web.exposure.include=health,info,ping
management.endpoint.health.show-details=always

# CORS Origins Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://event-mng-v2.vercel.app,http://localhost:5173,http://localhost:3000}

# JWT Configuration
application.security.jwt.secret-key=${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=3600
application.security.jwt.refresh-expiration=360000

# Mail Configuration (Brevo SMTP & REST API)
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:a70f06001@smtp-brevo.com}
spring.mail.password=${SMTP_PASSWORD:xsmtpsib-65022c62e4cab32026cad3d6da114fc6ac1a85f529eca8ed188edff07f44c390-T7WMuMUrknxYatO2}
brevo.api.key=${BREVO_API_KEY:${spring.mail.password}}
app.mail.from=${MAIL_FROM:canhhuu205@gmail.com}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=true

# PayOS Configuration
payos.client-id=${PAYOS_CLIENT_ID:72597898-f1de-419e-9e28-fd89968f5900}
payos.api-key=${PAYOS_API_KEY:03d46f9a-5cb8-4b4e-9b45-6052041279d4}
