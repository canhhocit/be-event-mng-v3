# Jackson Configuration
spring.jackson.deserialization.fail-on-unknown-properties=false

# Application URLs
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.backend.url=${BACKEND_URL:http://localhost:8080}

# Mobile app deep link used after payment redirect
app.payment.deep-link.scheme=${PAYMENT_DEEP_LINK_SCHEME:customer}
app.payment.deep-link.host=${PAYMENT_DEEP_LINK_HOST:payment-status}
app.payment.deep-link.path=${PAYMENT_DEEP_LINK_PATH:/}

# File Storage Configuration
app.upload.dir=uploads
app.file.base-url=${app.backend.url}/images

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# HTTP Response Compression Optimization (Gzip)
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=512
